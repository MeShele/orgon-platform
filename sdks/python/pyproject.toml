[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orgon-sdk"
version = "0.1.0"
description = "Official ORGON B2B API SDK — custodial wallets for exchangers, banks, and exchanges"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]
authors = [
    { name = "ASYSTEM", email = "support@orgon.asystem.kg" },
]
keywords = ["orgon", "custodial", "wallets", "crypto", "tron", "bitcoin", "ethereum", "safina"]

[project.urls]
Homepage = "https://orgon.asystem.ai/developers"
Repository = "https://github.com/MeShele/orgon-platform"

[tool.hatch.build.targets.wheel]
packages = ["orgon_sdk"]
